[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sahu-shorts"
version = "0.1.0"
description = "CLI for Sahu Shorts: clip long videos into vertical shorts and publish them, from the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sahu Shorts" }]
keywords = ["video", "clips", "shorts", "ai", "tiktok", "youtube-shorts", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/saki923/sahu-shorts"
Source = "https://github.com/saki923/sahu-shorts"
Documentation = "https://github.com/saki923/sahu-shorts/mcp"

[project.scripts]
sahu-shorts = "sahu_shorts_cli:main"

[tool.setuptools]
py-modules = ["sahu_shorts_cli"]
